name: Schema Validation

on:
  push:
    paths:
      - 'tests/**'
      - 'docs/*-schema.md'
      - 'requirements-test.txt'
      - 'pytest.ini'
  pull_request:
    paths:
      - 'tests/**'
      - 'docs/*-schema.md'
      - 'requirements-test.txt'

jobs:
  schema-tests:
    name: Schema & Format Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run format validation tests
        run: pytest tests/schema/ -m "format" -v --tb=short

      - name: Run completeness tests
        run: pytest tests/schema/ -m "completeness" -v --tb=short

      - name: Run consistency tests
        run: pytest tests/schema/ -m "consistency" -v --tb=short

      - name: Run boundary tests
        run: pytest tests/schema/ -m "boundary" -v --tb=short

      - name: Run Redis stream schema tests
        run: pytest tests/schema/ -m "redis" -v --tb=short

      - name: Run MQTT schema tests
        run: pytest tests/schema/ -m "mqtt" -v --tb=short

      - name: Run model package tests
        run: pytest tests/schema/ -m "model" -v --tb=short

  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: safety_test
          POSTGRES_USER: safety_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Initialize test database
        run: |
          PGPASSWORD=test_password psql -h localhost -p 5433 -U safety_test -d safety_test -f tests/fixtures/init-db.sql

      - name: Run integration tests (fakeredis)
        run: pytest tests/integration/ -v --tb=short -k "not Postgres"

      - name: Run integration tests (real Redis + PostgreSQL)
        env:
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6380
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5433
        run: pytest tests/integration/ -v --tb=short

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --tb=short

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY || true
