[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

markers =
    format: Format validation tests (ID patterns, timestamps, enums)
    completeness: Required field completeness tests
    consistency: Cross-field consistency rules (C-001~C-009)
    boundary: Boundary value and edge case tests
    integration: Integration tests (requires Redis/PostgreSQL)
    e2e: End-to-end simulator tests (requires full test environment)
    schema: Schema-level validation tests
    redis: Redis Streams specific tests
    mqtt: MQTT payload validation tests
    model: Model package validation tests
