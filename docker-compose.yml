# ============================================================
# Platform 1.0 - Edge AI Server 통합 배포
# docker compose up -d
# ============================================================
version: "3.9"

services:
  # --- Infrastructure ---
  redis:
    image: redis:7-alpine
    container_name: safety-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: safety-mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '#' -C 1 -W 1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Core Services ---
  device-gateway:
    build:
      context: ./services/device-gateway
      dockerfile: Dockerfile
    container_name: safety-device-gateway
    restart: always
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ./services/device-gateway/config:/app/config:ro
    devices:
      - /dev/video0:/dev/video0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-inference:
    build:
      context: ./services/ai-inference
      dockerfile: Dockerfile
    container_name: safety-ai-inference
    restart: always
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai-inference/config:/app/config:ro
      - models-data:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  event-processor:
    build:
      context: ./services/event-processor
      dockerfile: Dockerfile
    container_name: safety-event-processor
    restart: always
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/event-processor/config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  alarm-controller:
    build:
      context: ./services/alarm-controller
      dockerfile: Dockerfile
    container_name: safety-alarm-controller
    restart: always
    ports:
      - "8004:8004"
    env_file: .env
    privileged: true
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/alarm-controller/config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cloud-sync:
    build:
      context: ./services/cloud-sync
      dockerfile: Dockerfile
    container_name: safety-cloud-sync
    restart: always
    ports:
      - "8005:8005"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/cloud-sync/config:/app/config:ro
      - certs-data:/certs:ro
      - sync-queue-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard-backend:
    build:
      context: ./apps/dashboard-backend
      dockerfile: Dockerfile
    container_name: safety-dashboard-backend
    restart: always
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/dashboard-backend/config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Training Server (별도 서버 또는 동일 서버 GPU 시간분할) ---
  training-pipeline:
    build:
      context: ./services/training-pipeline
      dockerfile: Dockerfile
    container_name: safety-training-pipeline
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/training-pipeline/config:/app/config:ro
      - models-data:/models
      - training-data:/data/training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  mosquitto-data:
  models-data:
  training-data:
  certs-data:
  sync-queue-data:
